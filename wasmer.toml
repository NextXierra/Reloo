[package]
name = "adit80129/reloo"
version = "0.1.0"
description = "Reloo Minimalist Curated Marketplace"
license = "MIT"
readme = "guide.md"
repository = "https://github.com/NextXierra/Reloo.git"

[dependencies]
"php/php" = "^8.3"

[fs]
"/app" = "."
"/config" = "config"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "0.0.0.0:8080", "/app/server.php"]
env = ["PHPRC=/config/php.ini"]
